[project]
name = "daniel-portfolio-api"
version = "1.0.0"
description = "FastAPI service serving Daniel E's portfolio content."
requires-python = ">=3.12"
dependencies = [
	"email-validator",
	"fastapi==0.115.6",
	"pydantic==2.10.4",
	"pydantic-settings==2.7.1",
	"python-multipart==0.0.20",
	"uvicorn[standard]==0.34.0",
]

[dependency-groups]
dev = [
	"httpx==0.28.1",
	"pytest==8.3.4",
	"pytest-cov==6.0.0",
	"ruff==0.8.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()-as-default is the framework's idiomatic DI pattern, not a bug.
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
